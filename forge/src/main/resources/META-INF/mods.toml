modLoader = "javafml"
loaderVersion = "[${forge_version},)"
issueTrackerURL = "${link_issues}"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "${mod_name}"
    authors = "${mod_authors}"
    description = "${mod_description}"
    logoFile = "icon.png"

[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[${forge_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    mandatory = true
    versionRange = "${minecraft_version}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId="create"
    mandatory=true
    versionRange="${create_version}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="midnightlib"
    mandatory=true
    versionRange="*"
    ordering="NONE"
    side="CLIENT"